name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: scripts/lint.sh
      - uses: leanprover/lean-action@v1
      - name: No sorry inside definitions
        run: scripts/signatures.sh --sorry-in-defs
