name = "RiemannMasullo"
version = "0.1.0"
defaultTargets = ["RiemannMasullo", "Challenge", "Main"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[lean_lib]]
name = "RiemannMasullo"

# Comparator: `Challenge` is the statement to prove, `Main` is the solution. See comparator.json.
[[lean_lib]]
name = "Challenge"
roots = ["Statements", "Challenge"]

[[lean_lib]]
name = "Main"
roots = ["Main"]
